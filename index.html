<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixxiCode AI Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(18, 18, 22, 0.75);
            --border-color: rgba(255, 102, 0, 0.25);
            --accent-orange: #ff5500;
            --accent-hover: #e04b00;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 280px; background: rgba(12, 12, 15, 0.85); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; transition: all 0.3s ease; z-index: 10;
        }
        .sidebar.collapsed { width: 0; opacity: 0; pointer-events: none; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--accent-orange); }

        .new-chat-btn {
            margin: 15px; padding: 12px; background: rgba(255, 85, 0, 0.1);
            border: 1px solid var(--border-color); color: var(--accent-orange);
            border-radius: 10px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 8px; font-weight: 600; transition: 0.2s;
        }
        .new-chat-btn:hover { background: var(--accent-orange); color: #fff; }
        .chat-history { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item {
            padding: 12px 14px; border-radius: 8px; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem;
            margin-bottom: 5px; transition: 0.2s; border: 1px solid transparent;
        }
        .history-item:hover, .history-item.active { background: rgba(255, 255, 255, 0.03); color: var(--text-main); border-color: rgba(255, 255, 255, 0.08); }
        .history-item .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 1; }
        .top-bar {
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); background: rgba(10, 10, 12, 0.6); backdrop-filter: blur(10px);
        }
        .toggle-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #22c55e; }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px 20%; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 15px; max-width: 90%; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
        .user .avatar { background: var(--accent-orange); color: white; }
        .ai .avatar { background: linear-gradient(135deg, #ff5500, #a855f7); color: white; }

        .message-wrapper { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
        .message-content {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; backdrop-filter: blur(10px);
        }
        .user .message-content { background: rgba(255, 85, 0, 0.15); border-color: rgba(255, 85, 0, 0.3); }

        .code-container { background: #050507; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; margin-top: 10px; overflow: hidden; }
        .code-header { background: rgba(255, 255, 255, 0.04); padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); }
        pre { padding: 12px; overflow-x: auto; font-family: monospace; font-size: 0.88rem; color: #38bdf8; margin: 0; }

        .input-area { padding: 20px 20%; }
        .input-box-wrapper { display: flex; flex-direction: column; background: rgba(18, 18, 22, 0.95); border: 1px solid var(--border-color); border-radius: 14px; }
        .input-box { padding: 10px 14px; display: flex; align-items: center; gap: 10px; }

        textarea { width: 100%; background: transparent; border: none; outline: none; color: #ffffff; resize: none; height: 24px; max-height: 150px; font-size: 1rem; }
        .send-btn { background: var(--accent-orange); border: none; color: white; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Скрытная надпись 36.2 справа снизу */
        .stealth-watermark {
            position: fixed;
            bottom: 6px;
            right: 12px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.12);
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            z-index: 9999;
        }

        @media (max-width: 768px) { .chat-container, .input-area { padding-left: 15px; padding-right: 15px; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo"><i class="fa-solid fa-brain"></i> MixxiCode AI</div>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()"><i class="fa-solid fa-plus"></i> Новый чат</button>
        <div class="chat-history" id="chatHistory"></div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <div class="status-badge">MixxiCode Engine</div>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area">
            <div class="input-box-wrapper">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Спроси меня про C#, WPF или HTML/CSS..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Элемент скрытной надписи -->
    <div class="stealth-watermark">36.2</div>

    <script>
        // Замените значение ниже на ваш ключ от OpenRouter (например, "sk-or-v1-...")
        const API_KEY = "YOUR_OPENROUTER_API_KEY";

        let chats = JSON.parse(localStorage.getItem('mixxi_fast_chats')) || [];
        let currentChatId = null;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'Новый диалог',
                messages: [{ sender: 'ai', text: 'Привет! Я ассистент MixxiCode. Готов создавать красивые веб-сайты и Desktop-приложения на C#!' }]
            };
            chats.unshift(newChat);
            saveToStorage();
            loadChat(newChat.id);
            renderHistory();
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            if (chat) chat.messages.forEach(m => renderMessage(m.sender, m.text));
            renderHistory();
        }

        function renderHistory() {
            const historyContainer = document.getElementById('chatHistory');
            historyContainer.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(chat.id);
                item.innerHTML = `<div class="chat-title"><i class="fa-regular fa-message" style="margin-right: 8px;"></i>${escapeHtml(chat.title)}</div>`;
                historyContainer.appendChild(item);
            });
        }

        function saveToStorage() { localStorage.setItem('mixxi_fast_chats', JSON.stringify(chats)); }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!API_KEY || API_KEY.includes("YOUR_OPENROUTER_API_KEY") || /[^\x00-\x7F]/.test(API_KEY)) {
                renderMessage('ai', '⚠️ Укажите валидный API-ключ OpenRouter в переменной API_KEY (без кириллицы).');
                return;
            }

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 1) chat.title = text.slice(0, 20) + '...';

            chat.messages.push({ sender: 'user', text: text });
            renderMessage('user', text);
            input.value = '';

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            const history = chat.messages.map(m => ({
                role: m.sender === 'user' ? 'user' : 'assistant',
                content: m.text
            }));

            history.unshift({
                role: "system",
                content: "Ты — высококлассный Senior разработчик MixxiCode AI. Отвечай всегда на русском языке. Отлично верстаешь современный HTML/CSS и пишешь эстетичный C# (WPF/WinUI/Avalonia). Отвечай четко, выдавая красивый и готовый код."
            });

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.5-flash",
                        "messages": history
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `Ошибка сервера: ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                chat.messages.push({ sender: 'ai', text: aiText });
                saveToStorage();
                renderMessage('ai', aiText);
            } catch (e) {
                console.error(e);
                renderMessage('ai', '⚠️ Ошибка: ' + e.message);
            }

            renderHistory();
            sendBtn.disabled = false;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function renderMessage(sender, text) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const icon = sender === 'user' ? 'fa-user' : 'fa-robot';

            msgDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid ${icon}"></i></div>
                <div class="message-wrapper">
                    <div class="message-content">${parseMarkdownAndCode(text)}</div>
                </div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function parseMarkdownAndCode(str) {
            return str
                .replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, (m, lang, code) => 
                    `<div class="code-container"><div class="code-header"><span>${lang || 'code'}</span></div><pre><code>${escapeHtml(code.trim())}</code></pre></div>`)
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        if (chats.length === 0) createNewChat();
        else loadChat(chats[0].id);
    </script>
</body>
</html>
